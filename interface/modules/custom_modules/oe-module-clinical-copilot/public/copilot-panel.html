<aside id="copilot-panel" class="card oe-copilot__panel">
    <div class="card-body oe-copilot__card-body">
        <h5 class="card-title oe-copilot__title">Clinical Co-Pilot</h5>
        <div id="copilot-message-list" class="oe-copilot__message-list"></div>
        <div class="input-group oe-copilot__input-group">
            <input
                type="text"
                id="copilot-input"
                class="form-control oe-copilot__input"
                placeholder="Ask about this patient…"
                autocomplete="off"
            />
            <div class="input-group-append">
                <button type="button" id="copilot-send" class="btn btn-primary oe-copilot__send">Send</button>
            </div>
        </div>
    </div>
</aside>
